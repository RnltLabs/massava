name: Fix Failed Migration

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  fix-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix failed migration on staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo "🔧 Fixing failed migration..."

            # Pull latest image
            docker pull ghcr.io/rnltlabs/massava:staging

            # Mark failed migration as rolled back
            docker run --rm \
              --network host \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              ghcr.io/rnltlabs/massava:staging \
              sh -c "npx prisma migrate resolve --rolled-back 20251117_add_cron_performance_indexes"

            echo "✅ Failed migration resolved"

            # Run migrations again
            docker run --rm \
              --network host \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              ghcr.io/rnltlabs/massava:staging \
              sh -c "npx prisma migrate deploy"

            echo "✅ All migrations completed!"
