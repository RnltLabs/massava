name: Deploy to Staging

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/massava:staging
        build-args: |
          DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_VERCEL_ENV=staging
          GIT_COMMIT=${{ github.sha }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/massava:staging
        cache-to: type=inline

    - name: Run Database Migrations
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🔄 Running database migrations..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/massava:staging

          # Run migrations in a temporary container
          docker run --rm \
            --network host \
            -e DATABASE_URL="${{ secrets.DATABASE_URL_STAGING }}" \
            ${{ secrets.DOCKER_USERNAME }}/massava:staging \
            sh -c "prisma migrate deploy"

          if [ $? -eq 0 ]; then
            echo "✅ Database migrations completed successfully"
          else
            echo "❌ Database migrations failed"
            exit 1
          fi

    - name: Seed Test Data (Staging Only)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🌱 Seeding test data for staging environment..."

          # Run seed script in a temporary container (uses prisma/seed.ts)
          docker run --rm \
            --network host \
            -e DATABASE_URL="${{ secrets.DATABASE_URL_STAGING }}" \
            ${{ secrets.DOCKER_USERNAME }}/massava:staging \
            sh -c "npx prisma db seed"

          if [ $? -eq 0 ]; then
            echo "✅ Test data seeded successfully"
            echo "👥 Test accounts created:"
            echo "   - Studio Owners: 3 accounts (password: test123)"
            echo "     - maria.schmidt@thai-wellness-oase.de"
            echo "     - sabine.meyer@sabai-massage.de"
            echo "     - petra.wagner@lotus-spa.de"
            echo "   - Customers: 8 accounts (password: test123)"
          else
            echo "❌ Test data seeding failed"
            exit 1
          fi

    - name: Deploy to Staging Server
      uses: appleboy/ssh-action@v1.0.3
      env:
        FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: FIREBASE_ADMIN_SDK_JSON
        script: |
          echo "🚀 Deploying application..."
          docker stop massava-staging || true
          docker rm massava-staging || true
          docker run -d \
            --network host \
            -e NODE_ENV=production \
            -e PORT=3005 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL_STAGING }}" \
            -e AUTH_URL="https://staging.massava.app" \
            -e NEXTAUTH_URL="https://staging.massava.app" \
            -e NEXTAUTH_BASEPATH="/api/auth" \
            -e AUTH_TRUST_HOST="true" \
            -e AUTH_SECRET="${{ secrets.AUTH_SECRET_STAGING }}" \
            -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            -e RESEND_FROM_EMAIL="noreply@massava.app" \
            -e NEXT_PUBLIC_VERCEL_ENV=staging \
            -e NEXT_PUBLIC_APP_URL="https://staging.massava.app" \
            -e HEALTH_DATA_ENCRYPTION_KEY="${{ secrets.HEALTH_DATA_ENCRYPTION_KEY_STAGING }}" \
            -e FIREBASE_ADMIN_SDK_JSON="$FIREBASE_ADMIN_SDK_JSON" \
            -e NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            -e NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            -e NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            -e NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            -e NEXT_PUBLIC_FIREBASE_VAPID_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}" \
            -e UPSTASH_REDIS_URL="${{ secrets.UPSTASH_REDIS_URL }}" \
            -e UPSTASH_REDIS_TOKEN="${{ secrets.UPSTASH_REDIS_TOKEN }}" \
            -e QSTASH_URL="${{ secrets.QSTASH_URL }}" \
            -e QSTASH_TOKEN="${{ secrets.QSTASH_TOKEN }}" \
            -e QSTASH_CURRENT_SIGNING_KEY="${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}" \
            -e QSTASH_NEXT_SIGNING_KEY="${{ secrets.QSTASH_NEXT_SIGNING_KEY }}" \
            -e RADAR_SECRET_KEY="${{ secrets.RADAR_SECRET_KEY }}" \
            --name massava-staging \
            --restart unless-stopped \
            ${{ secrets.DOCKER_USERNAME }}/massava:staging
          docker image prune -f
          echo "✅ Application deployed successfully"

    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          sleep 5
          if docker ps | grep -q massava-staging; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
            exit 1
          fi

    - name: Notify Discord on Success
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_MASSAVA_STAGING }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🧪 Staging Deployment Successful",
              "description": "Massava deployed to staging environment",
              "color": 16776960,
              "fields": [
                {
                  "name": "Environment",
                  "value": "Staging",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                },
                {
                  "name": "URL",
                  "value": "[Open App](https://staging.massava.app)",
                  "inline": false
                },
                {
                  "name": "Commit",
                  "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                  "inline": false
                }
              ],
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
            }]
          }'

    - name: Notify Discord on Failure
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_MASSAVA_STAGING }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "❌ Staging Deployment Failed",
              "description": "Massava staging deployment encountered an error",
              "color": 15158332,
              "fields": [
                {
                  "name": "Environment",
                  "value": "Staging",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref_name }}",
                  "inline": true
                },
                {
                  "name": "Commit",
                  "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                  "inline": false
                },
                {
                  "name": "Workflow Run",
                  "value": "[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
            }]
          }'
