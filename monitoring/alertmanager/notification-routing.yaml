---

# Performance Tuning
#
# Alert Resolution Time:
# - Adjust group_wait to balance latency vs. grouping
# - Lower for critical (0-10s), higher for info (30-60s)
#
# Alert Repetition:
# - Critical: Repeat every 5 minutes (until acknowledged)
# - Warning: Repeat every 30 minutes
# - Info: Repeat every 4 hours
#
# If too many false positives:
# - Increase alert evaluation period
# - Increase threshold values
# - Reduce sensitivity of anomaly detection
#
# If missing real incidents:
# - Decrease alert evaluation period
# - Decrease threshold values
# - Add more specific alert conditions
